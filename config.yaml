vision:
  detector_type: yolo

  yolo:
    weights: Models/YOLO_Detector/weights/best.onnx
    conf: 0.45
    iou: 0.45
    device: cpu

  subtract:
    background_image: data/no_object.jpg
    mode: improved
    threshold: 30
    min_area: 500
    kernel_size: 25
    roi: null
    merge_horizontal_gap: 25
    merge_vertical_overlap_ratio: 0.35
    hsv_threshold_boost: 8

  tracker:
    max_distance: 300.0
    max_missing_frames: 4
    prefer_downward_motion: true
    start_track_id: 1

  events:
    enabled: true
    axis: y
    line_ratio: 0.88
    direction: positive
    trigger_position: leading_edge
    min_track_age: 1
    unknown_label: unknown

classifier:
  enabled: false
  #gallery_path: Models/Prototype_Classifier/galleries/default_gallery.npz
  gallery_path: Models/Prototype_Classifier/galleries/gallery.npz
  dino_model: dinov2-small
  dino_backend: onnx
  dino_onnx_path: Models/DINO/onnx/dinov2-small.onnx
  device: auto

camera:
  type: api
  camera_path: /World/Camera
  width: 640
  height: 480
  auto_find_camera: true
  frame_delay: 0.0

  api_url: http://127.0.0.1:3000
  endpoint: /api/demo/camera/rgb/frame
  timeout: 10.0
  retry_delay: 0.2
  wait: false

operator_store:
  enabled: true
  root_dir: data/operator_events
  save_crops: true
  crop_padding: 12

operator_app:
  runtime_mode: novelty
  debug_video: false
